name: Checks

on:
  pull_request:
    branches: [main]
    paths:
      - VERSION
      - index.html
      - sw.js
      - ledger.js
      - tests/**
      - scripts/**
      - package.json
      - .github/workflows/**
  push:
    branches: [main]
    paths:
      - VERSION
      - index.html
      - sw.js
      - ledger.js
      - tests/**
      - scripts/**
      - package.json
      - .github/workflows/**

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-version-sync.sh

  tests:
    name: Scripts parse + ledger tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Fails on a syntax error in index.html's inline scripts or ledger.js.
      - run: node scripts/check-scripts.mjs
      # Evaluates index.html's module to catch top-level runtime errors
      # (e.g. a global that doesn't exist) that node --check cannot see.
      - run: node scripts/check-module-eval.mjs
      # Unit tests: pure ledger engine (balance + deferral rules) and the
      # Firebase error classifier. Explicit files because tests/ also contains
      # smoke.spec.js, which is Playwright's, not node:test's.
      - run: node --test tests/ledger.test.js tests/errors.test.js

  # Browser smoke test: actually executes the app (local mode + real Firebase
  # startup), so it catches runtime wiring errors the other checks cannot.
  # Verified to fail on a deliberate runtime error before being made required.
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
