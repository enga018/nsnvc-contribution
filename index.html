<header>

<main>

    <div id="loginCard" class="login-card">
      <h2>Council login</h2>
      <div class="field">
        <label>Email</label>

    <div id="dashboard" class="hidden">
      <div class="dash-head">

        <div style="display:flex;gap:4px">
          <button class="btn small ghost" id="settingsBtn">⚙️</button>
          <button class="btn small ghost" id="logoutBtn">Log out</button>
        </div>
      </div>
      <div class="stats" style="grid-template-columns:repeat(2,1fr)">
        <div class="stat" style="text-align:center">
          <div class="k">Still to collect</div>
          <div class="v due" id="stOut" style="font-size:22px">₹0</div>
          <div class="sub" id="stPendingCount" style="font-size:11.5px;color:var(--muted);margin-top:4px">—</div>
        </div>
        <div class="stat" style="text-align:center">
          <div class="k">Deferred</div>
          <div class="v" style="font-size:22px;color:var(--partial)" id="stDeferred">₹0</div>
          <div class="sub" id="stDeferredCount" style="font-size:11.5px;color:var(--muted);margin-top:4px">—</div>
        </div>
        <div class="stat" style="text-align:center">
          <div class="k">Overpaid</div>
          <div class="v paid" id="stOverpaid" style="font-size:22px">₹0</div>
          <div class="sub" id="stOverpaidCount" style="font-size:11.5px;color:var(--muted);margin-top:4px">—</div>
        </div>
      </div>
      <div class="toolbar">
        <input id="adminSearch" type="text" placeholder="Search job card no. or name" />
        <button class="btn small ghost" id="clearSearchBtn" style="display:none">Clear</button>
      </div>
      <div id="pendingContainer" class="hidden" style="margin-bottom:12px;">
        <div class="panel" style="background:var(--surface);border:1px solid #f0d99a;">
          <h4>Pending UPI payments <span id="pendingCount" class="pending-badge">0</span></h4>

</main>

<script>
(function(){
  const showDiagnostic = msg => {
    const el = document.getElementById("loginErr");
    if(el) el.innerHTML = '<div class="notice err">' + msg + '</div>';
  };
  window.__nsnvcModuleStarted = false;
  window.__nsnvcLoginAttempted = false;
  window.addEventListener("error", e => {
    const msg = e && e.message ? e.message : "Unknown JavaScript error";
    showDiagnostic("App error: " + msg);
    console.error("NSNVC startup error:", e.error || e);
  });
  window.addEventListener("unhandledrejection", e => {
    const reason = e && e.reason;
    const msg = reason && reason.message ? reason.message : String(reason || "Unknown promise error");
    showDiagnostic("App error: " + msg);
    console.error("NSNVC unhandled rejection:", reason);
  });
  document.getElementById("loginBtn")?.addEventListener("click", () => {
    setTimeout(() => {
      if(!window.__nsnvcLoginAttempted && !window.__nsnvcModuleStarted){
        showDiagnostic("The app JavaScript did not start. Refresh the app or open it in Brave/Chrome to test.");
      }
    }, 150);
  });
})();
</script>

  recalcFromLedger as recalcFromLedgerEngine,
  periodKey
} from "./ledger.js";
import { makeLocalStore, makeFirebaseStore } from "./store.js";
/* ============================================================

  storageBucket: "nsnvc-contribution.firebasestorage.app",
  messagingSenderId: "686034384332",

if(window.__nsnvcForceLocalMode){ for(const k of Object.keys(firebaseConfig)) firebaseConfig[k]="PASTE_HERE"; }

/* ---------- constants ---------- */
const CURRENCY = "₹";
const TOAST_DURATION_MS = 2200;
const DASHBOARD_REFRESH_DEBOUNCE_MS = 250;
const CACHE_REFRESH_DELAY_MS = 5000;
const SHEET_CLOSE_DELAY_MS = 900;
const LOGOUT_DELAY_MS = 1000;
const FIRESTORE_BATCH_SIZE = 400;
const BACKUP_MAX_SIZE_BYTES = 5*1024*1024;
const BACKUP_MAX_HOUSEHOLDS = 10000;

/* ---------- persistent dashboard cache ---------- */
// IndexedDB keeps the last known dashboard data across refreshes/restarts.
// Firestore remains authoritative; this cache is only used to render quickly
// while the live Firestore snapshot refreshes it in the background.
const DASHBOARD_CACHE_DB = "nsnvc-dashboard-cache";
const DASHBOARD_CACHE_VERSION = 1;
const DASHBOARD_CACHE_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000;
let dashboardCacheReady = null;
const ledgerCacheSyncAt = new Map();
function firestoreTimeMs(value){
  if(!value) return 0;
  if(typeof value==="number") return value;
  if(typeof value.toMillis==="function") return value.toMillis();
  if(typeof value.seconds==="number") return value.seconds*1000;
  return 0;
}

function openDashboardCache(){
  if(dashboardCacheReady) return dashboardCacheReady;
  dashboardCacheReady = new Promise((resolve,reject)=>{
    if(!("indexedDB" in window)){ resolve(null); return; }
    const req=indexedDB.open(DASHBOARD_CACHE_DB,DASHBOARD_CACHE_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains("citizens")) db.createObjectStore("citizens",{keyPath:"id"});
      if(!db.objectStoreNames.contains("ledgers")) db.createObjectStore("ledgers",{keyPath:"id"});
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  }).catch(err=>{
    console.warn("Persistent dashboard cache unavailable:",err);
    dashboardCacheReady=null;
    return null;
  });
  return dashboardCacheReady;
}

async function readDashboardCache(){
  const db=await openDashboardCache();
  if(!db) return null;
  return new Promise(resolve=>{
    const tx=db.transaction(["citizens","ledgers"],"readonly");
    const citizensReq=tx.objectStore("citizens").getAll();
    const ledgersReq=tx.objectStore("ledgers").getAll();
    tx.oncomplete=()=>{
      const now=Date.now();
      const citizens=citizensReq.result.filter(x=>now-(x.cachedAt||0)<=DASHBOARD_CACHE_MAX_AGE_MS);
      const ledgers=ledgersReq.result.filter(x=>now-(x.cachedAt||0)<=DASHBOARD_CACHE_MAX_AGE_MS);
      resolve({citizens,ledgers});
    };
    tx.onerror=()=>resolve(null);
  });
}

function writeDashboardCache(citizens, ledgers){
  openDashboardCache().then(db=>{
    if(!db) return;
    try{
      const tx=db.transaction(["citizens","ledgers"],"readwrite");
      const citizenStore=tx.objectStore("citizens");
      const ledgerStore=tx.objectStore("ledgers");
      const cachedAt=Date.now();
      for(const c of (citizens||[])){
        const copy={...c};
        delete copy.ledger;
        citizenStore.put({...copy,cachedAt});
      }
      for(const [id,entries] of Object.entries(ledgers||{})){
        ledgerStore.put({id,entries:entries||[],cachedAt,syncAt:firestoreTimeMs((citizens||[]).find(c=>c.id===id)?.updatedAt)||cachedAt});
      }
    }catch(err){
      console.warn("Failed to write dashboard cache:",err);
    }
  }).catch(()=>{});
}

async function hydrateDashboardCache(){
  try{
    const cached=await readDashboardCache();
    if(!cached) return false;

    if(cached.citizens.length){
      rawCitizens=cached.citizens.map(({cachedAt,...c})=>c);
      allCitizens=rawCitizens.slice();
    }

    if(cached.ledgers.length){
      for(const item of cached.ledgers){
      ledgerCache.set(item.id,item.entries||[]);
      ledgerCacheSyncAt.set(item.id,Number(item.syncAt||item.cachedAt||0));
    }
      periodStatsCache=null;
      invalidateStatsMemo();
    }

    const needsLedger = Boolean(
      deferredPeriods.length ||
      Object.keys(deferredPeriodOverrides).length
    );
    if(rawCitizens.length && needsLedger && cached.ledgers.length){
      allCitizens=rawCitizens.map(c=>({...c,ledger:ledgerCache.get(c.id)||[]}));
    }

    if(allCitizens.length){
      periodsReady=false;
      unpaidCache=new Map();
      renderStats();
      renderList();
      return true;
    }
  }catch(err){
    console.warn("Failed to hydrate dashboard cache:",err);
  }
  return false;
}

// Deferral state is owned here (the app mutates these on login and on every
// defer action) and handed to the ledger engine, which resolves deferral from
// it. `nextDeferTimestamp` provides strictly-increasing stamps so "latest wins"
// is never decided by a same-millisecond tie.
let deferClock=0;
function nextDeferTimestamp(previous=0){
  deferClock=Math.max(Date.now(), deferClock+1, (Number(previous)||0)+1);
  return deferClock;
}

// App-side deferral write helpers (DOM/state mutation live here; the read-time
// resolution rules live in the engine).
function setCitizenChargeOverride(next, citizenId, entry, value){
  const existing=next[citizenId];
  let overrides;
  if(existing && !Array.isArray(existing) && typeof existing==="object"){
    overrides={...existing};
  }else{
    overrides={};
    if(Array.isArray(existing)){
      existing.forEach(p=>{ if(p) overrides[p]={value:false,at:0}; });
    }
  }
  const key=entry && entry.entryId ? String(entry.entryId) : String(entry && entry.note || "").trim();
  if(!key) return;
  if(value===null){
    delete overrides[key];
  }else{
    const previous=overrides[key];
    overrides[key]={value:Boolean(value),at:nextDeferTimestamp(previous && previous.at)};
  }
  if(Object.keys(overrides).length) next[citizenId]=overrides;
  else delete next[citizenId];
}
/* ---------- Per-citizen stats memoization ----------
   getEffectiveBalance/getDeferredAmount/statusOf run up to ~10× per household
   per dashboard render (stats, filter tabs, list filtering, card HTML). The
   expensive part — calculateLedgerState over the ledger — is pure for a given
   citizen snapshot and the current period/defer/override state, so results are
   cached against a small fingerprint:
     - citizen id
     - whether a ledger is attached (the no-ledger path reads c.balance)
     - c.balance for that fallback path
     - statsRevision, bumped wherever ledgerCache or the period/deferral/
       override state changes (the same sites that already null
       periodStatsCache).
   Because the fingerprint includes c.balance, a fresh Firestore snapshot with
   a new balance is never served stale even when statsRevision has not moved.
   In-place ledger mutations (deleteEntry/editEntry) keep the same array
   reference but bump statsRevision, so cached numbers are invalidated there
   too. */
let statsRevision=0;
const statsMemo=new Map();
function invalidateStatsMemo(){
  statsRevision++;
  // Bound memory usage across many revisions (e.g. bulk imports).
  if(statsMemo.size>5000) statsMemo.clear();
}
function statsMemoEntry(c){
  if(!c || c.id==null) return null;
  const key = Array.isArray(c.ledger)
    ? "L|"+statsRevision+"|"+c.id
    : "B|"+statsRevision+"|"+c.id+"|"+(c.balance!=null?c.balance:0);
  let rec=statsMemo.get(key);
  if(!rec){ rec={balance:null,deferred:null}; statsMemo.set(key,rec); }
  return rec;
}
function statusOf(c){
  const bal = getEffectiveBalance(c);
  if(bal<=0) return "paid";
  if((c.totalPaid||0)>0) return "partial";
  return "due";
}
function getEffectiveBalance(c){
  // When a ledger is attached, it is always authoritative. This is the same
  // calculation used by the person account view, so dashboard status cannot disagree with the household's actual account.
  const rec=statsMemoEntry(c);
  if(rec && rec.balance!==null) return rec.balance;
  let value;
  if(c && Array.isArray(c.ledger)){
    value = calculateLedgerState(c.ledger, c.id).balance;
  }else{
    // The live citizen snapshot may not include a ledger yet. In that case use
    // the stored summary when no period/override state requires live ledgers.
    value = Number(c && c.balance != null ? c.balance : 0);
  }
  if(rec) rec.balance=value;
  return value;
}
function getDeferredAmount(c){
  const rec=statsMemoEntry(c);
  if(rec && rec.deferred!==null) return rec.deferred;
  let value=0;
  if(c && Array.isArray(c.ledger)){
    // Informational only. Deferred charges never participate in balance.
    value = c.ledger.reduce((sum,e)=>{
      if(!e || (e.type!=="charge" && e.type!=="sanitationFee")) return sum;
      const deferred=isPeriodDeferredForCitizen(e,c.id);
      return sum + (deferred ? Math.max(0,Number(e.amount)||0) : 0);
    },0);
  }
  if(rec) rec.deferred=value;
  return value;
}
const statusLabel = {paid:"Cleared", partial:"Partly paid", due:"Due"};
function todayISO(){ return new Date().toISOString().slice(0,10); }
const DATE_DISPLAY_CUTOFF = "2026-07-01";
function displayDate(date){ return (date && date >= DATE_DISPLAY_CUTOFF) ? date : ""; }
function prettyPeriod(note){
  return String(note||"").trim();
}
function entryLabel(e){
  if(!e || !e.type) return "Unknown";
  if(e.type==="payment"){
    const note=e.note;
    const modes=["cash","bank","upi"];
    if(note && modes.includes(note.toLowerCase())) return note.charAt(0).toUpperCase()+note.slice(1).toLowerCase();
    return "Payment";
  }
  if(e.type==="forgive") return "Waived";
  if(e.type==="sanitationFee") return "Sanitation Fee";
  return prettyPeriod(e.note) || "Contribution";
}
function suffixOf(s){ s=String(s||"").trim(); const i=s.lastIndexOf("/"); return (i>=0?s.slice(i+1):s).trim().toLowerCase(); }
function fullKey(s){ return (String(s||"").trim().replace(/\//g,"%2F").replace(/^\.+$/,"_")) || "_"; }
function seqNum(s){ const n=parseInt(String(s==null?"":s).replace(/[^0-9]/g,""),10); return isNaN(n)?Number.MAX_SAFE_INTEGER:n; }
function byCardNo(a,b){ const d=seqNum(a.cardNo)-seqNum(b.cardNo); return d!==0?d:String(a.jobCard||a.id).localeCompare(String(b.jobCard||b.id)); }

/* ---------- Error classification ---------- */
// Firestore quota/billing problems are NOT connectivity problems, and telling a
// user "check your internet" sends them down the wrong path. Classify so the UI
// can say what is actually wrong.
function classifyFirebaseError(err){
  // A code/message can live on the error or on its `cause` (Firestore wraps
  // server errors that way). Collect ALL candidates — using `||` would let an
  // outer placeholder like code:"unknown" hide the real cause code.
  const codes = [
    err && err.code,
    err && err.cause && err.cause.code,
  ].filter(Boolean).map(String).map(s => s.toLowerCase());
  const text = [
    err && (err.message || err),
    err && err.cause && err.cause.message,
  ].filter(Boolean).map(String).join(" ").toLowerCase();

  const isQuota = codes.some(c => c === "resource-exhausted" || c === "429") ||
    text.includes("quota") || text.includes("resource_exhausted") || text.includes("resource-exhausted");
  const isDenied = codes.some(c => c === "permission-denied") ||
    text.includes("missing or insufficient permissions");
  const isOffline = codes.some(c => c === "unavailable") ||
    text.includes("offline") || text.includes("network") ||
    text.includes("failed to fetch") || text.includes("timeout");

  if(isQuota) return "quota";
  if(isDenied) return "permission";
  if(isOffline) return "offline";
  return "unknown";
}

// Firebase is configured but unreachable. Do NOT substitute sample data: show a
// blocking screen and keep retrying. Returns a store on success, null on
// failure (after showing the screen).
async function initFirebaseStoreWithRetry(){
  const attempts = 3;
  let lastErr = null;
  for(let i=1;i<=attempts;i++){
    try{
      console.log(`Initializing Firebase (attempt ${i}/${attempts})...`);
      const fbModule = await Promise.race([
        loadFirebase(firebaseConfig),
        new Promise((_,reject) => setTimeout(()=>reject(new Error("timeout after 15s")), 15000))
      ]);
      console.log("Firebase loaded successfully");
      return makeFirebaseStore(fbModule, storeHost);
    }catch(err){
      lastErr = err;
      console.error(`Firebase initialization attempt ${i} failed:`, err);
      // Retrying a quota/billing error is pointless — it stays broken until the
      // quota resets — so fail fast with an accurate message.
      if(classifyFirebaseError(err) !== "offline") break;
      if(i < attempts){
        await new Promise(r=>setTimeout(r, 1500*i));
      }
    }
  }
  showOfflineBlock(lastErr);
  return null;
}

async function onAuth(isIn){

    try{
      const [deferredState, rawOverrides] = await Promise.all([
        store.getDeferredPeriods(),
        store.getDeferredPeriodOverrides()
      ]);
      const normalizedPeriods=normalizeDeferredPeriodState(deferredState);
      deferredPeriods = normalizedPeriods.periods;
      deferredPeriodUpdatedAt = normalizedPeriods.updatedAt;
      const normalizedOverrides=normalizeDeferredPeriodOverrides(rawOverrides);
      deferredPeriodOverrides = normalizedOverrides.overrides;
      syncDeferralStateToEngine();

      // Migrate legacy shapes once on load. Missing timestamps become 0 so
      // existing per-person state remains valid until a new action supersedes it.
      if(normalizedPeriods.migrated){
        await store.setDeferredPeriods(deferredPeriods.slice());
      }
      if(normalizedOverrides.migrated){
        await store.setDeferredPeriodOverrides(deferredPeriodOverrides);
      }
      // Restore the last dashboard snapshot immediately after login. The live
      // Firestore subscription below will replace it with authoritative data.
      await hydrateDashboardCache();
      subscribeCitizens();
      scheduleOneTimeMaintenance();
    } catch(err){ console.error("Failed to load period settings:", err); }
    setTimeout(refreshPending, 0);
  } else {

    $("dashboard").classList.add("hidden");

  }
}

   ============================================================ */
function subscribeCitizens(){
  if(citizensUnsub) return;
  citizensUnsub = store.subscribe(list=>{
    rawCitizens = list;
    // Persist the lightweight citizen snapshot as soon as Firestore gives us
    // authoritative data. This makes the next app start render without waiting
    // for the network. Ledgers are NOT rewritten here: refreshChangedLedgers /
    // getAllLedgers already persist only the ledgers they actually refetch, so
    // writing the whole ledgerCache on every snapshot (which fires on each
    // citizen write) was re-serializing every household's ledger to IndexedDB
    // on every refresh — the dominant cache-write cost on a slow connection.
    writeDashboardCache(list, {});
    scheduleDashboardRefresh();
  });
}
// The live citizen list from subscribe() only carries cached totals, not each
// household's ledger — so getEffectiveBalance can't apply deferrals unless we
// attach the ledger ourselves whenever any deferral is active. Objects in
// allCitizens therefore only carry .ledger while a period is deferred (or a
// per-person override exists) — any future code reading c.ledger directly
// (instead of through getEffectiveBalance/getDeferredAmount, which both guard
// for its absence) needs to handle it being missing.
function invalidateLedgerCache(id){
  if(id) ledgerCache.delete(id); else ledgerCache.clear();
  periodStatsCache = null;
  invalidateStatsMemo();
}
function recalcFromLedger(entries, citizenId){
  return recalcFromLedgerEngine(entries, citizenId);
}
function getPeriodStats(){
  if(periodStatsCache) return periodStatsCache;
  const periods=new Set(), stats=new Map();
  for(const [cid,entries] of ledgerCache){
    for(const e of entries){
      if(e.type==="charge" && e.note){
        periods.add(e.note);
        const s=stats.get(e.note)||{count:0,amount:0};
        s.count++; s.amount+=Number(e.amount||0);
        stats.set(e.note,s);
      }
    }
  }
  periodStatsCache={periods:[...periods].sort((a,b)=>periodKey(a)-periodKey(b)),stats};
  return periodStatsCache;
}
function scheduleDashboardRefresh(){
  // Coalesces bursts of Firestore snapshot events (e.g. a bulk import
  // triggering many rapid writes) into a single ledger refetch instead of
  // one full refetch per event.
  clearTimeout(dashboardRefreshTimer);
  dashboardRefreshTimer = setTimeout(refreshDashboard, DASHBOARD_REFRESH_DEBOUNCE_MS);
  clearTimeout(cacheRefreshTimer);
  cacheRefreshTimer = setTimeout(()=>{
    if(deferredPeriods.length || Object.keys(deferredPeriodOverrides).length){
      const refresh = typeof store.refreshChangedLedgers==="function"
        ? store.refreshChangedLedgers(rawCitizens || [])
        : store.getAllLedgers();
      refresh.catch(e=>console.warn("Background ledger cache refresh failed:",e));
    }
  }, CACHE_REFRESH_DELAY_MS);
}
async function refreshDashboard(){
  const seq = ++dashboardRefreshSeq;
  let list = rawCitizens || [];
  const needsLedger = Boolean(
    deferredPeriods.length ||
    Object.keys(deferredPeriodOverrides).length
  );

  // Cache-first dashboard: render the last known in-memory ledger state
  // immediately instead of waiting for another Firestore ledger read.
  // Firestore is still refreshed in the background so the cache never becomes
  // the authority; it is only the fast working copy used while syncing.
  if(needsLedger && list.length > 0){
    const cachedList = list.map(c => ({...c, ledger: ledgerCache.get(c.id) || []}));
    const hasCompleteCache = list.every(c => Array.isArray(ledgerCache.get(c.id)));
    if(hasCompleteCache){
      allCitizens = cachedList;
      periodsReady = false;
      unpaidCache = new Map();
      renderStats();
      renderList();
    }
  }

  if(needsLedger){
    try{
      if(typeof store.refreshChangedLedgers==="function"){
        await store.refreshChangedLedgers(list);
      }else{
        await store.getAllLedgers();
      }
    }catch(e){
      console.error("Failed to refresh dashboard ledgers:", e);
    }

    if(list.length > 0){
      list = list.map(c => ({...c, ledger: ledgerCache.get(c.id) || []}));
    }
  }

  if(seq !== dashboardRefreshSeq) return; // superseded by a newer refresh; drop this stale result
  allCitizens = list;
  // The period dropdown's cache (unpaidCache/periodsReady) was built from
  // whatever allCitizens looked like at the time it was requested. If that
  // happened before the very first citizen list arrived (e.g. someone opens
  // the dropdown right after login), it would otherwise permanently cache an
  // empty result — periodsReady stays true forever with no periods listed.
  // Invalidating it here means the next dropdown focus (or an already-active
  // period filter, re-checked by renderList below) recomputes against
  // current data instead of a possibly-stale/empty snapshot.
  periodsReady = false;
  unpaidCache = new Map();
  renderStats(); renderList(); refreshPending();
}
function renderStats(){
  const pending = allCitizens.filter(c=>getEffectiveBalance(c)>0);
  const out = pending.reduce((s,c)=>s+Math.max(0,getEffectiveBalance(c)),0);
  $("stOut").textContent = fmt(out);
  $("stPendingCount").textContent = `${pending.length} household${pending.length===1?"":"s"} pending`;

  const deferred = allCitizens.filter(c=>getDeferredAmount(c)>0);
  const deferredOut = deferred.reduce((s,c)=>s+getDeferredAmount(c),0);
  $("stDeferred").textContent = fmt(deferredOut);
  $("stDeferredCount").textContent = `${deferred.length} household${deferred.length===1?"":"s"} deferred`;

  const overpaid = allCitizens.filter(c=>getEffectiveBalance(c)<0);
  const overpaidOut = overpaid.reduce((s,c)=>s+Math.abs(getEffectiveBalance(c)),0);
  $("stOverpaid").textContent = fmt(overpaidOut);
  $("stOverpaidCount").textContent = `${overpaid.length} household${overpaid.length===1?"":"s"} overpaid`;
}

async function loadOwedBreakdown(){
  if(loadingPeriods) return; loadingPeriods=true;
  const pend=allCitizens.filter(c=>getEffectiveBalance(c)>0);
  const cache=new Map(), set=new Set();
  await Promise.all(pend.map(async c => {
    try{
      // Period filtering must not turn into one Firestore read per household.
      // Use a ledger already attached to the dashboard or present in cache;
      // otherwise this citizen simply cannot contribute period options yet.
      const led = Array.isArray(c.ledger)
        ? c.ledger
        : ledgerCache.get(c.id);
      if(!Array.isArray(led)) return;
      const owed=getOwedBreakdown(led, c.id);
      const up=owed.filter(o=>o.note).map(o=>o.note);
      cache.set(c.id, up); up.forEach(p=>set.add(p));
    }catch(e){}
  }));
  unpaidCache=cache; periodsReady=true; loadingPeriods=false;
  const sel=$("periodSel");
  if(sel){
    const periods=[...set].sort((a,b)=>periodKey(a)-periodKey(b));
    sel.innerHTML=`<option value="">All pending (any period)</option>`+
      periods.map(p=>`<option value="${esc(p)}"${p===periodFilter?" selected":""}>Pending: ${esc(prettyPeriod(p))}</option>`).join("");
  }
  renderStats(); renderList();
}

function filterCitizenList(citizens, searchTerm, filter, periodFilter){
  let list = citizens.slice();
  if(searchTerm){
    list = list.filter(c => (c.jobCard||c.id).toLowerCase().includes(searchTerm) || (c.name||"").toLowerCase().includes(searchTerm));
  }
  if(filter==="pending"){
    list = list.filter(c => getEffectiveBalance(c)>0);
    if(periodFilter){
      if(!periodsReady && !loadingPeriods) loadOwedBreakdown();
      list = list.filter(c => (unpaidCache.get(c.id)||[]).includes(periodFilter));
    }
  } else if(filter==="deferred"){
    list = list.filter(c => getDeferredAmount(c)>0);
  } else if(filter==="overpaid"){
    list = list.filter(c => getEffectiveBalance(c)<0);
  }
  list.sort(byCardNo);
  return list;
}

function buildCitizenCardHTML(citizen, filter){
  const bal = getEffectiveBalance(citizen);
  const deferred = getDeferredAmount(citizen);
  const st = statusOf(citizen);
  let small, balText, balColor;

  if(filter==="deferred"){
    small = `${esc(citizen.jobCard||citizen.id)} · Deferred ${fmt(deferred)}`;
    balText = fmt(deferred);
    balColor = 'var(--partial)';
  } else if(filter==="overpaid"){
    small = `${esc(citizen.jobCard||citizen.id)} · Overpaid`;
    balText = fmt(Math.abs(bal));
    balColor = 'var(--paid)';
  } else {
    small = esc(citizen.jobCard||citizen.id);
    balColor = bal>0 ? 'var(--due)' : 'var(--paid)';
    balText = bal<0 ? `₹0 (+${fmt(Math.abs(bal))})` : fmt(Math.max(0,bal));
  }

  return `<div class="citizen-row" data-id="${esc(citizen.id)}" style="display:flex;align-items:center;gap:10px;padding:12px 15px;border-top:1px solid var(--border);width:100%;cursor:pointer">

    <span class="info" style="flex:1;min-width:0">
      <b style="display:block;font-weight:600;font-size:15px">${esc(citizen.name||"—")}</b>
      <small style="font-size:12px;color:var(--muted);display:block;margin-top:2px">${small}</small>
    </span>
    <span class="bal money" style="white-space:nowrap;color:${balColor}">${balText}</span>
  </div>`;
}

function showMoreCitizens(){
  const list=adminFilteredList, total=list.length;
  const wrap=$("adminMoreWrap");
  if(adminShown>=total){ if(wrap) wrap.remove(); else { const mb=$("adminMore"); if(mb) mb.remove(); } return; }
  const next=Math.min(adminShown+ADMIN_STEP,total);
  const html=list.slice(adminShown,next).map(c=>buildCitizenCardHTML(c,adminFilter)).join("");
  // Insert the new cards before the "show more" wrapper (or at the end).
  if(wrap) wrap.insertAdjacentHTML("beforebegin",html);
  else $("adminList").insertAdjacentHTML("beforeend",html);

  bindCitizenRows($("adminList"));
  const mb=$("adminMore");
  if(mb){ if(adminShown>=total){ const w=$("adminMoreWrap"); (w||mb).remove(); } else mb.innerHTML=moreButtonHTML(adminShown,total); }

    <button class="period-defer-btn btn small ghost" data-period="${esc(period)}" data-deferred="${isDeferred?"1":"0"}" style="padding:6px 9px;font-size:12px;color:var(--partial);border-color:var(--partial)">${isDeferred?"Restore":"Defer"}</button>

function renderPeriodsList(periods, stats){
  if(!periods.length) return '<div style="color:var(--muted)">No periods found yet.</div>';
  return periods.map(p => {
    const s = stats.get(p) || {count:0, amount:0};
    const isDef = deferredPeriods.includes(p);
    return buildPeriodRowHTML(p, s, isDef);
  }).join("");
}

function updatePeriodsSaveBtn(pendingRenames){
  const renCount = pendingRenames.size;
  const btn = $("savePeriodsBtn");
  if(renCount===0){ btn.disabled=true; btn.textContent="Save"; return; }
  btn.disabled=false;
  btn.textContent=`Save (${renCount} rename${renCount===1?"":"s"})`;
}

function handlePeriodRename(btn, row, pendingRenames, updateSaveBtn){
  const oldName = btn.dataset.period;
  if(pendingRenames.has(oldName)){
    pendingRenames.delete(oldName);
    row.classList.remove("period-row-renamed");
    row.querySelector(".period-name").innerHTML=`<b style="font-size:14px">${esc(prettyPeriod(oldName))}</b>`;
    btn.textContent="✏️";
    updateSaveBtn(pendingRenames);
    return;
  }

  row.classList.add("period-row-renamed");
  row.querySelector(".period-name").innerHTML=`<input class="period-rename-input" value="${esc(oldName)}">`;
  btn.textContent="✕";
  const input = row.querySelector(".period-rename-input");
  input.focus(); input.select();

  function applyRename(){
    const newVal = input.value.trim();
    if(newVal && newVal !== oldName){
      pendingRenames.set(oldName, newVal);
      row.querySelector(".period-name").innerHTML=`<b style="font-size:14px">${esc(prettyPeriod(oldName))}</b> → <b style="font-size:14px;color:var(--green)">${esc(prettyPeriod(newVal))}</b>`;
      btn.textContent="✕";
    } else {
      pendingRenames.delete(oldName);
      row.classList.remove("period-row-renamed");
      row.querySelector(".period-name").innerHTML=`<b style="font-size:14px">${esc(prettyPeriod(oldName))}</b>`;
      btn.textContent="✏️";
    }
    updateSaveBtn(pendingRenames);
  }

  input.addEventListener("keydown", e=>{
    if(e.key==="Enter") applyRename();
    if(e.key==="Escape"){
      pendingRenames.delete(oldName);
      row.classList.remove("period-row-renamed");
      row.querySelector(".period-name").innerHTML=`<b style="font-size:14px">${esc(prettyPeriod(oldName))}</b>`;
      btn.textContent="✏️";
      updateSaveBtn(pendingRenames);
    }
  });
  input.addEventListener("blur", applyRename);
}

async function handlePeriodsSave(pendingRenames){
  const msg=$("periodsMsg");
  const btn=$("savePeriodsBtn");
  btn.disabled=true;
  msg.innerHTML='<div class="notice info">Saving…</div>';
  try{
    periodsReady=false;
    unpaidCache=new Map();
    periodStatsCache=null;
    invalidateStatsMemo();
    const renameResults = await Promise.all(
      Array.from(pendingRenames).map(([oldName,newName])=>store.renamePeriod(oldName,newName))
    );
    if(pendingRenames.size){
      const renamedDeferred = deferredPeriods.map(p=>pendingRenames.get(p) || p);
      if(JSON.stringify(renamedDeferred)!==JSON.stringify(deferredPeriods)){
        // A rename is not a new defer. Carry the renamed period's original
        // timestamp onto its new name; otherwise it would look freshly deferred
        // and override per-person restores in that period.
        for(const [oldName,newName] of pendingRenames){
          if(Object.prototype.hasOwnProperty.call(deferredPeriodUpdatedAt, oldName)){
            deferredPeriodUpdatedAt[newName]=deferredPeriodUpdatedAt[oldName];
          }
        }
        await store.setDeferredPeriods(renamedDeferred);
        deferredPeriods=renamedDeferred;
        syncDeferralStateToEngine();
      }
    }
    const renamed = renameResults.reduce((sum,n)=>sum+n,0);
    pendingRenames.clear();
    msg.innerHTML=`<div class="notice info" style="background:var(--green-soft);color:var(--green-dark)">Done — ${renamed} rename${renamed===1?"":"s"}.</div>`;
    toast("Periods updated");
    await refreshDashboard(); loadOwedBreakdown();
  }catch(err){
    console.error(err);
    msg.innerHTML='<div class="notice err">Failed to save.</div>';
    btn.disabled=false;
  }
}

function togglePeriodDeferred(period, shouldDefer){
  const next = deferredPeriods.filter(p=>p!==period);
  if(shouldDefer) next.push(period);
  deferredPeriodUpdatedAt[period]=nextDeferTimestamp(deferredPeriodUpdatedAt[period]);
  deferredPeriods = next;
  syncDeferralStateToEngine();
  periodsReady=false;
  unpaidCache=new Map();
  periodStatsCache=null;
  invalidateStatsMemo();
  renderStats();
  renderList();
}

function attachPeriodListeners(pendingRenames){
  document.querySelectorAll(".period-defer-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const period=btn.dataset.period;
      const shouldDefer=btn.dataset.deferred!=="1";
      const previous = deferredPeriods.slice();
      const previousUpdatedAt = {...deferredPeriodUpdatedAt};

      btn.disabled=true;
      togglePeriodDeferred(period, shouldDefer);

      // Update only the clicked control; keep the Manage Periods sheet open.
      btn.dataset.deferred = shouldDefer ? "1" : "0";
      btn.textContent = shouldDefer ? "Restore" : "Defer";
      btn.disabled=false;
      toast(shouldDefer ? `Deferred ${prettyPeriod(period)}` : `Restored ${prettyPeriod(period)}`);

      // Persist in the background. Roll back local state and the clicked
      // control if Firestore rejects the write.
      store.setDeferredPeriods(deferredPeriods.slice())
        .then(()=>clearOperationErrors())
        .catch(err=>{
          console.error(err);
          deferredPeriods=previous;
          deferredPeriodUpdatedAt=previousUpdatedAt;
          syncDeferralStateToEngine();
          periodsReady=false;
          unpaidCache=new Map();
          periodStatsCache=null;
          invalidateStatsMemo();
          renderStats();
          renderList();
          btn.dataset.deferred = shouldDefer ? "0" : "1";
          btn.textContent = shouldDefer ? "Defer" : "Restore";
          toast("Failed to update period");
        });
    });
  });
  document.querySelectorAll(".period-rename-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const row = btn.closest(".period-row");
      handlePeriodRename(btn, row, pendingRenames, updatePeriodsSaveBtn);
    });
  });
  $("savePeriodsBtn").addEventListener("click", ()=>handlePeriodsSave(pendingRenames));
}

async function openManagePeriods(){
  // Prefer the hydrated memory/IndexedDB ledger cache. Refresh only ledgers
  // whose citizen updatedAt is newer; do a full read only for an incomplete cache.
  const citizens=Array.isArray(rawCitizens)?rawCitizens:[];
  if(citizens.length && typeof store.refreshChangedLedgers==="function"){
    await store.refreshChangedLedgers(citizens);
  }

  const cacheComplete=citizens.length>0 && citizens.every(c=>Array.isArray(ledgerCache.get(c.id)));
  if(!cacheComplete){
    // Correctness fallback for a partial/empty cache (for example first use).
    await store.getAllLedgers();
  }

  const { periods, stats } = getPeriodStats();
  const pendingRenames = new Map();
  const rows = renderPeriodsList(periods, stats);

  openSheet("Manage Periods", `
    <p style="font-size:13px;color:var(--muted);margin:0 0 14px">Use <b>Defer</b> to temporarily move a whole period out of current collection. Deferred periods remain recorded and appear under <b>Deferred</b>. Use <b>Restore</b> when you want to collect them. Defer/Restore applies immediately.</p>
    ${rows}
    <button class="btn block" id="savePeriodsBtn" disabled style="margin-top:14px">Save</button>
    <div id="periodsMsg" style="margin-top:12px"></div>
  `);

  attachPeriodListeners(pendingRenames);
}

let recalculateBusy=false;
async function doRecalcAllFromSettings(){
  if(recalculateBusy) return;
  const ok = await confirmAction("Recalculate every household's balance from its history? This is safe and fixes any wrong totals.");
  if(!ok) return;

  recalculateBusy=true;
  const msg=$("settingsMsg");
  const btn=$("settingsRecalc");
  if(btn){ btn.disabled=true; btn.textContent="Recalculating…"; }
  msg.innerHTML='<div class="notice info">Reading every household ledger…</div>';

  try{
    const recalcStart=performance.now();
    const n=await store.recalcAll((d,t)=>{
      msg.innerHTML=`<div class="notice info">Recalculating… ${d} / ${t}</div>`;
    });
    const recalcEnd=performance.now();

    // The live Firestore listener will normally update the dashboard, but
    // refresh explicitly so the repaired totals are visible immediately.
    const dashboardRefreshStart=performance.now();
    await refreshDashboard();
    const dashboardRefreshMs=performance.now()-dashboardRefreshStart;
    console.log("Recalculate timing:",{
      storeTotalMs:Math.round(recalcEnd-recalcStart),
      dashboardRefreshMs:Math.round(dashboardRefreshMs),
      totalMs:Math.round(performance.now()-recalcStart)
    });
    clearOperationErrors();
    msg.innerHTML=`<div class="notice info" style="background:var(--green-soft);color:var(--green-dark)">Done — ${n} households recalculated from transaction history.</div>`;
    toast("Balances recalculated");
  }catch(err){
    console.error("Recalculate failed:",err);
    const detail = err && (err.code || err.message) ? ` ${esc(err.code||"")}${err.message ? ": "+esc(err.message) : ""}` : "";
    msg.innerHTML=`<div class="notice err">Recalculate failed.${detail}</div>`;
  }finally{
    recalculateBusy=false;
    if(btn){ btn.disabled=false; btn.textContent="Recalculate all balances"; }
  }
}

async function encryptBackupData(data, password){
  if(!password) return JSON.stringify(data);
  try{
    const encoder = new TextEncoder();
    const dataBytes = encoder.encode(JSON.stringify(data));
    const saltBytes = crypto.getRandomValues(new Uint8Array(16));
    const pwBytes = encoder.encode(password);
    const keyMaterial = await crypto.subtle.importKey("raw", pwBytes, {name:"PBKDF2"}, false, ["deriveBits"]);
    const keyBits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:saltBytes, iterations:100000, hash:"SHA-256"}, keyMaterial, 256);
    const key = await crypto.subtle.importKey("raw", keyBits, {name:"AES-GCM"}, false, ["encrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encrypted = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, dataBytes);
    const container = {v:1, salt:Array.from(saltBytes), iv:Array.from(iv), data:Array.from(new Uint8Array(encrypted))};
    return JSON.stringify(container);
  }catch(e){
    console.error("Encryption failed:", e);
    throw new Error("Backup encryption failed");
  }
}
async function decryptBackupData(dataStr, password){
  try{
    const container = JSON.parse(dataStr);
    if(!container.v || !container.salt || !container.iv || !container.data) throw new Error("Invalid encrypted backup format");
    const encoder = new TextEncoder();
    const saltBytes = new Uint8Array(container.salt);
    const ivBytes = new Uint8Array(container.iv);
    const encryptedBytes = new Uint8Array(container.data);
    const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(password), {name:"PBKDF2"}, false, ["deriveBits"]);
    const keyBits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:saltBytes, iterations:100000, hash:"SHA-256"}, keyMaterial, 256);
    const key = await crypto.subtle.importKey("raw", keyBits, {name:"AES-GCM"}, false, ["decrypt"]);
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv:ivBytes}, key, encryptedBytes);
    return JSON.parse(new TextDecoder().decode(decrypted));
  }catch(e){
    console.error("Decryption failed:", e);
    throw new Error("Decryption failed - wrong password or corrupted file");
  }
}
function validateBackupSchema(backup){
  if(!backup || typeof backup !== "object") throw new Error("Backup must be an object");
  if(!Array.isArray(backup.citizens)) throw new Error("Backup must contain a citizens array");
  if(backup.citizens.length > BACKUP_MAX_HOUSEHOLDS) throw new Error(`Backup too large (max ${BACKUP_MAX_HOUSEHOLDS} households)`);
  const validTypes = ["charge","payment","forgive","sanitationFee"];
  for(let i=0;i<backup.citizens.length;i++){
    const c=backup.citizens[i];
    if(typeof c.id !== "string" || !c.id) throw new Error(`Citizen ${i}: missing or invalid id`);
    if(typeof c.name !== "string") throw new Error(`Citizen ${i}: missing or invalid name`);
    if(!Number.isFinite(c.totalCharged) || !Number.isFinite(c.totalPaid) || !Number.isFinite(c.balance)) throw new Error(`Citizen ${i}: invalid numeric fields`);
    if(Array.isArray(c.ledger)){
      for(let j=0;j<c.ledger.length;j++){
        const e=c.ledger[j];
        if(!validTypes.includes(e.type)) throw new Error(`Citizen ${i}, entry ${j}: invalid type`);
        if(!Number.isFinite(e.amount) || e.amount < 0) throw new Error(`Citizen ${i}, entry ${j}: invalid amount`);
        if(typeof e.note !== "string") e.note = "";
        if(typeof e.date !== "string") e.date = "";
      }
    }
  }
}

async function doRestore(e){
  const file=e.target.files[0]; if(!file) return;
  if(file.size > BACKUP_MAX_SIZE_BYTES){
    $("backupMsg").innerHTML=`<div class="notice err">Backup file too large (max 5 MB).</div>`;
    e.target.value="";
    return;
  }
  const fileContent = await file.text();
  const isEncrypted = file.name.endsWith(".nsnvc-enc");
  if(isEncrypted){
    openSheet("Restore encrypted backup", `
      <p style="font-size:13px;color:var(--muted);margin:0 0 12px">This backup is encrypted. Enter the password to decrypt it.</p>
      <div class="field"><label>Password</label>
        <input id="restorePw" type="password" placeholder="Enter backup password"></div>
      <button class="btn block" id="restoreConfirm">Decrypt and restore</button>
      <div id="restoreMsg" style="margin-top:10px"></div>
    `);
    $("restoreConfirm").addEventListener("click", async ()=>{
      const pw = $("restorePw").value;
      if(!pw){ $("restoreMsg").innerHTML=`<div class="notice err">Password required</div>`; return; }
      try{
        const backup = await decryptBackupData(fileContent, pw);
        const success = await performRestore(backup, $("restoreMsg"));
        if(success) closeSheet();
      }finally{
        e.target.value="";
      }
    });
  } else {
    const msg = $("backupMsg");
    try{
      let backup;
      try{ backup = JSON.parse(fileContent); }catch(err){ msg.innerHTML=`<div class="notice err">Invalid JSON in backup file.</div>`; e.target.value=""; return; }
      await performRestore(backup, msg);
    }finally{
      e.target.value="";
    }
  }
}

/* ---------- one-time maintenance ---------- */
// After the period-exclusion feature was removed, stored citizen balances may
// still reflect excluded periods. Recalculate once from the ledgers under the
// new rules, and delete the now-unused meta/excludedPeriods document. Guarded
// by a device flag so it runs at most once (retries next login on failure).
const MAINTENANCE_KEY = "nsnvc_maintenance_2026_exclusion_removed";
let maintenanceScheduled = false;
function scheduleOneTimeMaintenance(){
  if(maintenanceScheduled) return;
  try{ if(localStorage.getItem(MAINTENANCE_KEY)) return; }catch(e){ return; }
  maintenanceScheduled = true;
  setTimeout(async ()=>{
    try{
      if(typeof store.deleteMeta === "function"){ try{ await store.deleteMeta("excludedPeriods"); }catch(e){} }
      if(typeof store.recalcAll === "function"){ await store.recalcAll(); }
      try{ localStorage.setItem(MAINTENANCE_KEY, "1"); }catch(e){}
      await refreshDashboard();
      console.log("One-time maintenance complete: balances recalculated after exclusion removal.");
    }catch(err){
      maintenanceScheduled = false; // allow a retry on the next login
      console.warn("One-time maintenance failed; will retry next login.", err);
    }
  }, 5000);
}

async function ensureXLSX(){

      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.integrity="sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==";
      s.crossOrigin="anonymous";
      s.onload=res;
      s.onerror=()=>rej(new Error("integrity check failed"));
      document.head.appendChild(s);
    });
  } catch(e) {
    console.warn("XLSX load with integrity failed, retrying without integrity:", e);
    await new Promise((res,rej)=>{
      const s=document.createElement("script");
      s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

}

function colOptions(header, sample, selected){
  const n=Math.max(header.length, sample?sample.length:0);
  let opts=`<option value="-1"${selected<0?" selected":""}>— none —</option>`;
  for(let i=0;i<n;i++){
    const raw=header[i];
    const name=(raw!=null && String(raw).trim()) ? String(raw).trim() : `Column ${String.fromCharCode(65+(i%26))}`;
    const s=(sample && sample[i]!=null) ? String(sample[i]).slice(0,20) : "";
    opts+=`<option value="${i}"${i===selected?" selected":""}>${esc(name)}${s?` — e.g. ${esc(s)}`:""}</option>`;
  }
  return opts;
}

      <div class="brow"><span>Ambiguous (skipped)</span><b>${ambiguous.length}</b></div>
      <div class="brow total"><span>Total charges</span><b class="money">${fmt(chargeAmt)}</b></div>
      <div class="brow total"><span>Total payments</span><b class="money">${fmt(payAmt)}</b></div>
    </div>
    ${issues.length?`<div class="panel" style="max-height:160px;overflow:auto"><h4>Skipped rows</h4>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.7">${issues.map(esc).join("<br>")}</div></div>`:``}
    <button class="btn block" id="impConfirm" ${(charges.length||payments.length)?"":"disabled"}>Process ${charges.length} charges and ${payments.length} payments</button>
    <div id="impProgress" style="margin-top:10px"></div>`;
  if($("impConfirm")) $("impConfirm").addEventListener("click", runUpload);
}

async function runUpload(){
  if(!pendingUpload) return;
  const period=$("impPeriod").value.trim();
  const dateStr=$("impDate").value || todayISO();
  const btn=$("impConfirm"); btn.disabled=true; const prog=$("impProgress");
  prog.innerHTML=`<div class="notice info">Processing…</div>`;
  try{
    let done=0, total=pendingUpload.charges.length+pendingUpload.payments.length;
    if(pendingUpload.charges.length && !period){
      prog.innerHTML=`<div class="notice err">Please type the period name above for charges.</div>`;
      $("impPeriod").focus();
      btn.disabled=false;
      return;
    }
    if(pendingUpload.charges.length){
      const chargeItems=pendingUpload.charges.map(it=>({...it, note:period}));
      await store.bulkAppendCharges(chargeItems,(d,t)=>{ done=d; prog.innerHTML=`<div class="notice info">Processing charges… ${d} / ${t}</div>`; });
      try{ await store.recordImportedPeriod(period); }catch(e){}
    }
    if(pendingUpload.payments.length){
      const when=new Date(dateStr+"T12:00:00");
      const payItems=pendingUpload.payments.map(it=>({...it, date:dateStr, when}));
      await store.bulkAppendPayments(payItems,(d,t)=>{ done=pendingUpload.charges.length+d; prog.innerHTML=`<div class="notice info">Processing payments… ${d} / ${t}</div>`; });
    }
    clearOperationErrors();
    prog.innerHTML=`<div class="notice info" style="background:var(--green-soft);color:var(--green-dark)">Done — ${pendingUpload.charges.length} charges and ${pendingUpload.payments.length} payments processed. Recalculating balances…</div>`;
    pendingUpload=null;
    if(deferredPeriods.length){
      store.recalcAll().then(()=>toast("Balances recalculated")).catch(e=>console.error("recalcAll after upload failed:", e));
    }
    setTimeout(()=>{ closeSheet(); toast("Upload complete"); },SHEET_CLOSE_DELAY_MS);
  }catch(err){
    handleOperationError("bulkUpload", err);
    prog.innerHTML=`<div class="notice err">Update failed partway. Check connection and try again.</div>`;
    btn.disabled=false;
  }
}

function resolveCitizen(value){
  const fk=fullKey(value);
  let cand=allCitizens.filter(c=>c.id===fk);
  if(!cand.length){ const suf=suffixOf(value); cand=allCitizens.filter(c=>(c.cardNo||"")===suf); }
  return cand;
}

function confirmAction(message, danger=false){
  return new Promise(resolve=>{
    const ov=document.createElement("div");
    ov.className="confirm-overlay";
    ov.innerHTML=`<div class="confirm-box">
      <div class="confirm-msg"></div>
      <div class="confirm-btns">
        <button class="btn small ghost" data-a="no">Cancel</button>
        <button class="btn small" data-a="yes"${danger?' style="background:var(--due)"':''}>Confirm</button>
      </div>
    </div>`;
    ov.querySelector(".confirm-msg").textContent = message;
    document.body.appendChild(ov);
    const done=v=>{ ov.remove(); resolve(v); };
    ov.addEventListener("click", e=>{ if(e.target===ov) done(false); });
    ov.querySelector('[data-a="no"]').addEventListener("click", ()=>done(false));
    ov.querySelector('[data-a="yes"]').addEventListener("click", ()=>done(true));
  });
}

async function renderCitizenDetail(id){
  const c = allCitizens.find(x=>x.id===id);
  if(!c){
    $("adminDetail").innerHTML = `<div class="notice err">Citizen not found. Please refresh and try again.</div>`;
    return;
  }
  try{
    let entries = ledgerCache.get(id);
    if(!Array.isArray(entries)){
      entries = await store.getLedger(id) || [];
      // Keep the already-loaded ledger in memory. Person-view actions such as
      // Defer/Restore must never perform a second Firestore read on tap.
      ledgerCache.set(id, entries);
    }
    // The citizen document may contain a stale cached balance and normally
    // does not contain the full ledger. The detail page has the authoritative
    // ledger already, so always calculate the displayed balance from it.
    const state = calculateLedgerState(entries, id);
    // This is the actual remaining balance: active charges minus all
    // payments and waivers. Deferred charges are excluded by the engine.
    const bal = state.balance;
    const allSorted = [...entries].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    const INITIAL_HISTORY = 3;

    const viewState = { historyExpanded: false, historyEditing: false };

    const hasOwing = bal > 0;
    const isOverpaid = bal < 0;
    const headerBadge = hasOwing
      ? `<span class="badge action action-paid" id="hdrMarkPaid">Pay Full Balance</span>`
      : isOverpaid
        ? `<span class="badge paid">Overpaid</span>`
        : `<span class="badge paid">Cleared</span>`;
    const actionBadges = hasOwing ? `<div class="badge-row" style="padding:0 18px 14px">
      <span class="badge action action-pay" id="btnPayment">Payment</span>
      <span class="badge action action-waive" id="btnWaive">Waive</span>
    </div>` : isOverpaid ? `<div class="badge-row" style="padding:0 18px 14px">
      <span class="badge action action-return" id="btnReturn">Return</span>
      <span class="badge action action-return" id="btnSanitationFee">Sanitation Fee</span>
    </div>` : '';
    const totalEntries = allSorted.length;
    const visibleEntries = viewState.historyExpanded ? allSorted : allSorted.slice(0, INITIAL_HISTORY);
    const hiddenCount = totalEntries - Math.min(INITIAL_HISTORY, totalEntries);
    const historyHTML = renderHistoryRows(visibleEntries, false, id);
    $("adminDetail").innerHTML = buildCitizenDetailHTML(c, bal, historyHTML, headerBadge, actionBadges, totalEntries, hiddenCount);
    attachCitizenDetailListeners(id, c, bal, allSorted, INITIAL_HISTORY, viewState);
  } catch(err) { console.error(err); }
}

function attachCitizenDetailListeners(id, citizen, balance, allSorted, initialHistoryCount, stateRef){

  if($("hdrMarkPaid")) $("hdrMarkPaid").addEventListener("click", async ()=>{

  // Return badge → open sheet
  if($("btnReturn")) $("btnReturn").addEventListener("click", ()=> openReturnSheet(id, balance));

  // Sanitation Fee badge → open sheet
  if($("btnSanitationFee")) $("btnSanitationFee").addEventListener("click", ()=> openSanitationFeeSheet(id, balance));

  $("delCitizen").addEventListener("click", ()=>deleteCitizen(id));
  $("adminBackBtn").addEventListener("click", closeCitizenDetail);

  // Edit button — toggles edit mode
  $("histEditBtn").addEventListener("click", ()=>{

    $("histEditBtn").textContent = stateRef.historyEditing ? "Done" : "Edit";
    const vis = stateRef.historyExpanded ? allSorted : allSorted.slice(0, initialHistoryCount);
    $("historyBody").innerHTML = renderHistoryRows(vis, stateRef.historyEditing, id);
    attachHistoryListeners(id, stateRef.historyEditing);
  });

  // See more / Show less
  if($("histMore")) $("histMore").addEventListener("click", ()=>{
    stateRef.historyExpanded = !stateRef.historyExpanded;
    const vis = stateRef.historyExpanded ? allSorted : allSorted.slice(0, initialHistoryCount);
    const hid = allSorted.length - vis.length;
    $("historyBody").innerHTML = renderHistoryRows(vis, stateRef.historyEditing, id);
    if(hid > 0){
      $("histMore").textContent = stateRef.historyExpanded ? "Show less" : `See more (${hid} more)`;
    } else {
      $("histMore").remove();
    }
    attachHistoryListeners(id, stateRef.historyEditing);
  });

  attachHistoryListeners(id, false);
}

function attachHistoryListeners(id, editing){
  // Defer / restore toggles — available directly on each charge.
  document.querySelectorAll(".defer-chk").forEach(chk=>{
    chk.addEventListener("change", async ()=>{
      const entryId = chk.dataset.id;
      const period = String(chk.dataset.period||"").trim();
      const nowChecked = chk.checked;

      // The person detail page caches its ledger before rendering the
      // checkbox, so this click path stays entirely local.
      const entries = ledgerCache.get(id);
      if(!Array.isArray(entries)){
        handleOperationError("deferCharge", new Error("Person ledger cache missing"));
        chk.checked=!nowChecked;
        toast("Please reopen this person and try again.");
        return;
      }

      const entry = entries.find(e=>e.entryId===entryId);
      if(!entry){
        chk.checked=!nowChecked;
        toast("Charge not found. Please reopen this person.");
        return;
      }
      const previousOverrides = JSON.parse(JSON.stringify(deferredPeriodOverrides));
      const next = JSON.parse(JSON.stringify(deferredPeriodOverrides));
      setCitizenChargeOverride(next, id, entry, nowChecked);
      deferredPeriodOverrides=next; periodStatsCache=null; invalidateStatsMemo(); syncDeferralStateToEngine();

      // Re-render immediately from the optimistic local state. Do not wait for
      // Firestore before updating the account view.
      renderCitizenDetail(id);
      clearOperationErrors();
      toast(nowChecked ? "Deferred" : "Restored");

      // Persist in the background. Roll back the local state and view only if
      // the write fails.
      store.setCitizenChargeDeferred(id, entryId, nowChecked)
        .then(()=>clearOperationErrors())
        .catch(e=>{
          deferredPeriodOverrides=previousOverrides; periodStatsCache=null; invalidateStatsMemo(); syncDeferralStateToEngine();
          chk.checked=!nowChecked;
          handleOperationError("deferCharge", e);
          renderCitizenDetail(id);
          toast("Failed to update deferral. Please try again.");
        });
    });
  });
  if(!editing) return;

  // Edit entry
  document.querySelectorAll(".edit-entry").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const entryId = btn.dataset.id;
      const entries = ledgerCache.get(id) || await store.getLedger(id);
      const entry = entries.find(e=>e.entryId===entryId);
      if(!entry) return;
      openEditEntry(id, entryId, entry);
    });
  });

  // Delete entry
  document.querySelectorAll(".del-entry").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const entryId = btn.dataset.id;
      if(!(await confirmAction("Delete this entry?", true))) return;
      await store.deleteEntry(id, entryId);
      toast("Entry deleted");
      await renderCitizenDetail(id);
    });
  });
}

  const note = $("editNote").value.trim();
  const date = $("editDate").value;
  try{
    await store.editEntry(citizenId, entryId, { amount:amt, note, date });
    clearOperationErrors();
    toast("Entry updated");
    closeSheet();
    await renderCitizenDetail(citizenId);
  }catch(err){
    handleOperationError("editEntry", err);
    toast("Failed to update");
  }
}

function openEditEntry(citizenId, entryId, entry){
  openSheet("Edit entry", `
    <div class="field"><label>Amount</label><input id="editAmt" type="number" step="0.01" value="${entry.amount}"></div>

let exportBusy=false;

async function withExportUI(buttonId, originalText, exportFn){
  if(exportBusy) return;
  exportBusy=true;
  const btn = $(buttonId);
  if(btn){ btn.disabled=true; btn.textContent="Preparing…"; }
  try{
    await exportFn();
    clearOperationErrors();
  }catch(err){
    handleOperationError("export", err);
    toast("Export failed");
  }finally{
    exportBusy=false;
    if(btn){ btn.disabled=false; btn.textContent=originalText; }
  }
}

async function doExportPdf(){
  await withExportUI("exportPdfBtn", "Export owing list (PDF)", async ()=>{
    const jsPDF = await ensureJsPDF();
    const searchTerm = $("adminSearch").value.trim().toLowerCase();
    const list = filterCitizenList(allCitizens, searchTerm, adminFilter, periodFilter)
      .filter(c => getEffectiveBalance(c) > 0);
    if(!list.length){ toast("No owing households to export"); return; }

    const fmtRs = n => "Rs. " + (Number(n)||0).toLocaleString("en-IN");
    const ledgers = ledgerCache.size ? Object.fromEntries(ledgerCache) : await store.getAllLedgers();
    const rows = [];
    for(const c of list){
      const entries = ledgers[c.id] || await store.getLedger(c.id);
      // PDF must use the live ledger, not the cached citizen.balance field.
      // This guarantees the displayed "total remaining" is the same
      // authoritative balance used by the account view.
      const bal = calculateLedgerState(entries, c.id).balance;
      if(!(bal > 0)) continue;
      const payments = entries.filter(e=>e.type==="payment").map(e=>fmtRs(e.amount));
      const charges = entries.filter(e=>{
        if(e.type!=="charge" && e.type!=="sanitationFee") return false;
        return !isPeriodDeferredForCitizen(e, c.id);
      }).map(e=>{
        const period = e.note && e.note.trim() ? e.note.trim() : (e.type==="sanitationFee" ? "Sanitation Fee" : "Charge");
        return `${period}: ${fmtRs(e.amount)}`;
      });
      rows.push({
        name: c.name || "—",
        jobCard: c.jobCard || c.id,
        amount: fmtRs(bal),
        payments: payments.length ? "Paid: " + payments.join(", ") : "",
        charges: charges.length ? charges.join(", ") : ""
      });
    }

    const doc = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pageW = doc.internal.pageSize.getWidth();
    const margin = 16;
    const rightX = pageW - margin;
    let y = 22;

    doc.setFontSize(18);
    doc.setFont(undefined, "bold");
    doc.text("Owing List", margin, y);
    y += 10;

    doc.setFontSize(10);
    doc.setFont(undefined, "normal");
    doc.text(`${todayISO()} · ${adminFilter.charAt(0).toUpperCase()+adminFilter.slice(1)}${periodFilter?` · ${periodFilter}`:""}`, margin, y);
    y += 14;

    doc.setDrawColor(230, 230, 230);
    for(const r of rows){
      if(y > doc.internal.pageSize.getHeight() - 36){ doc.addPage(); y = 20; }

      // Row 1: name followed immediately by the authoritative total remaining.
      doc.setFont(undefined, "bold");
      doc.setFontSize(11);
      const amountW = doc.getTextWidth(r.amount);
      const nameMaxW = pageW - margin*2 - amountW - 8;
      const nameLines = doc.splitTextToSize(r.name, nameMaxW);
      doc.setTextColor(40, 40, 40);
      doc.text(nameLines, margin, y);

      // Keep the amount directly after the name on the left whenever the
      // name fits. For a wrapped name, place it after the final name line.
      const nameLastLine = nameLines[nameLines.length - 1] || "";
      const nameLastW = doc.getTextWidth(nameLastLine);
      const amountX = margin + nameLastW + 5;
      doc.setTextColor(180, 40, 40);
      doc.text(r.amount, amountX, y + (nameLines.length - 1) * 3.8);

      // Row 2: job card (left) and charges (right, red).
      // The right-side details start on the same line as the citizen name.
      y += nameLines.length * 3.8 + 1;
      let rightY = y - nameLines.length * 3.8 - 1;
      doc.setFont(undefined, "normal");
      doc.setTextColor(120, 120, 120);
      doc.setFontSize(9);
      doc.text(r.jobCard, margin, y);

      if(r.charges){
        const chargeMaxW = 70;
        const chargeLines = doc.splitTextToSize(r.charges, chargeMaxW);
        doc.setTextColor(180, 40, 40);
        doc.text(chargeLines, rightX, rightY, { align: "right" });
        rightY += chargeLines.length * 3.8;
      }

      // Row 3: payments (right, green)
      if(r.payments){
        rightY += 1;
        const payMaxW = 70;
        const payLines = doc.splitTextToSize(r.payments, payMaxW);
        doc.setTextColor(26, 125, 66);
        doc.text(payLines, rightX, rightY, { align: "right" });
        rightY += payLines.length * 3.8;
      }

      y = Math.max(y + 3.8, rightY);
      doc.setFontSize(11);
      y += 2;
      doc.line(margin, y, pageW - margin, y);
      y += 5;
    }

    doc.save(`owing_${todayISO()}.pdf`);
    toast("PDF exported");
  });
}

async function openExportPeriod(){
  if(ledgerCache.size===0) await store.getAllLedgers();
  const { periods } = getPeriodStats();
  openSheet("Export by period", `
    <p style="font-size:13px;color:var(--muted);margin:0 0 12px">Select a period to export contribution charges for that month.</p>
    <div class="field"><label>Period</label>
      <select id="exportPeriodSel" class="period-sel">

        ${periods.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('')}
      </select>

  `);
  $("exportPeriodConfirm").addEventListener("click", async ()=>{

async function doExportPeriod(period){
  if(exportBusy) return; exportBusy=true;
  try{
    const ledgers = ledgerCache.size ? Object.fromEntries(ledgerCache) : await store.getAllLedgers();
    let csv = "Name,Job Card,Amount (₹),Status,Payment History\n";
    for(const c of allCitizens){
      const entries = ledgers[c.id] || [];
      const charge = entries.find(e => e.type==="charge" && e.note===period);
      if(charge){
        const payments = entries.filter(e=>e.type==="payment").map(e=>`${entryLabel(e)} ${fmt(e.amount)}`).join("; ");
        const status = charge.deferred ? "Deferred" : "Active";
        csv += `"${esc(c.name)}","${esc(c.jobCard)}",${charge.amount},"${status}","${esc(payments)}"\n`;
      }
    }
    downloadBlob(csv, `period_${esc(period).replace(/\s+/g,'_')}_${todayISO()}.csv`, "text/csv");
    toast("CSV exported");
  }catch(err){
    handleOperationError("exportPeriod", err);
    toast("Export failed");
  }finally{
    exportBusy=false;
  }
}

// Register service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    console.log('Service Worker registered', reg.scope);
    // The browser only checks sw.js for changes on navigation to a fresh
    // page load — reopening an installed PWA from the home screen often
    // just resumes an existing session instead, so that check never fires
    // on its own. Forcing it whenever the app comes back to the foreground
    // is what actually surfaces new versions without a manual hard reload.
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') reg.update().catch(()=>{});
    });
  }).catch(err=>{
    console.log('Service Worker registration failed', err);
  });
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    console.log('New service worker activated, reloading');
    window.location.reload();
  });
}
// Reached only if every top-level statement above ran without throwing. The
// module-eval CI check asserts on this (a positive signal) rather than trying to
// classify error messages.
