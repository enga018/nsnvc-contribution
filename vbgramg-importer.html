<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Import</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:20px}
main{display:flex;gap:10px;width:100%;max-width:640px;margin:0 auto}
input{flex:1;min-width:0;height:48px;padding:0 14px;border:1px solid #ccc;border-radius:8px;font:16px Arial,Helvetica,sans-serif}
button{height:48px;padding:0 18px;border:0;border-radius:8px;background:#222;color:#fff;font:16px Arial,Helvetica,sans-serif}
</style>
</head>
<body>
<main>
<input type="text" aria-label="Input" placeholder="Enter URL">
<button type="button">Submit</button>
</main>
</body>
</html>
